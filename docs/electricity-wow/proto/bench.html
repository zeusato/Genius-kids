// ---------------------------------------------------------------- DC solver (MNA, Norton form)

function solve(n, elems) {
  const G = Array.from({ length: n }, () => new Float64Array(n)); const I = new Float64Array(n);
  for (let i = 0; i < n; i++) G[i][i] += 1e-9;
  const sg = (a, b, g) => { G[a][a] += g; G[b][b] += g; G[a][b] -= g; G[b][a] -= g; };
  for (const e of elems) {
    if (e.kind === 'R') sg(e.a, e.b, 1 / e.R);
    else { sg(e.a, e.b, 1 / e.r); I[e.a] -= e.E / e.r; I[e.b] += e.E / e.r; }
  }
  const m = n - 1; const A = []; const x = new Float64Array(m); const rhs = Float64Array.from(I.slice(1));
  for (let i = 0; i < m; i++) A.push(Float64Array.from(G[i + 1].slice(1)));
  for (let c = 0; c < m; c++) {
    let p = c; for (let r = c + 1; r < m; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]]; [rhs[c], rhs[p]] = [rhs[p], rhs[c]];
    for (let r = c + 1; r < m; r++) { const f = A[r][c] / A[c][c]; if (!f) continue; for (let k = c; k < m; k++) A[r][k] -= f * A[c][k]; rhs[r] -= f * rhs[c]; }

  for (let r = m - 1; r >= 0; r--) { let s = rhs[r]; for (let k = r + 1; k < m; k++) s -= A[r][k] * x[k]; x[r] = s / A[r][r]; }

}

function part(kind, opts = {}) {

// ---------------------------------------------------------------- board
function board(w, d, x = 0, z = 0) {

// ---------------------------------------------------------------- wires: clear sheath + copper core + electrons
const wires = [];

// Route: rise from the post, lie flat on the board through waypoints (rounded corners), rise into the other post.
function routeCurve(a, b, waypoints) {

  const poly = [a.clone(), new V3(a.x, a.y + 0.2, a.z), toward(a, waypoints[0], 0.4), ...waypoints.map(([x, z]) => new V3(x, H, z)),
    toward(b, waypoints[waypoints.length - 1], 0.4), new V3(b.x, b.y + 0.2, b.z), b.clone()];

function simulate(parts) {

  const elems = [];
  const bat = parts.find(p => p.kind === 'battery'); node(bat.world[0]); // ground = battery (−)
  for (const p of parts) {
    const [a, b] = p.world; if (!p.connected) continue;
    if (p.kind === 'battery') elems.push({ kind: 'src', a: node(a), b: node(b), E: CELL.E * p.cells, r: CELL.r * p.cells });
    if (p.kind === 'bulb') elems.push({ kind: 'R', a: node(a), b: node(b), R: BULB.R, part: p });
    if (p.kind === 'switch' && p.closed) elems.push({ kind: 'R', a: node(a), b: node(b), R: WIRE_R });
  }
  for (const w of wires) elems.push({ kind: 'R', a: node(w.a), b: node(w.b), R: WIRE_R, wire: w });
  const V = solve(n, elems);
  const out = [];
  for (const e of elems) {
    const i = (V[e.a] - V[e.b]) / (e.R ?? 1);
    if (e.part) { const P = i * i * e.R; const b = Math.pow(P / BULB.Prated, 0.45); e.part.setGlow(b); out.push({ bulb: e.part.label, P, ratio: P / BULB.Prated, glow: b, I: Math.abs(i) }); }

  }
  const batI = bat.connected ? (V[node(bat.world[0])] === 0 ? null : null) : null;

}

  const [bn, bp] = bat.world, [l0, l1] = L.world;
  wire(bp, l1, '#e07c64', [[-0.9, bp.z], [-0.9, l1.z]]);
  wire(l0, cA, '#e07c64', [[-5.3, l0.z], [-5.3, -0.2], [-0.4, -0.2], [-0.4, cA.z]]);
  wire(bn, cB, '#4f9c95', [[-5.9, bn.z], [-5.9, 3.25], [3.3, 3.25], [3.3, cB.z]]);
  // everyday objects waiting in the tray
  const tray = new THREE.Mesh(new RoundedBoxGeometry(4.4, 0.14, 3.7, 4, 0.07), std('#e6dbc2', { roughness: 0.85 })); tray.position.set(3.95, 0.02, -1.55); tray.receiveShadow = true; scene.add(tray);
  const obj = (mesh, x, z, ry = 0) => { mesh.position.set(x, mesh.position.y, z); mesh.rotation.y = ry; shadowAll(mesh); scene.add(mesh); return mesh; };
  const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.07, 40), std('#d7a55a', { metalness: 1, roughness: 0.3 })); coin.position.y = 0.13; obj(coin, 2.4, -2.6);
  const eraser = new THREE.Mesh(new RoundedBoxGeometry(0.95, 0.32, 0.55, 3, 0.08), std('#f2929f', { roughness: 0.7 })); eraser.position.y = 0.25; obj(eraser, 3.7, -2.6, 0.3);
  const pencil = new THREE.Group(); pencil.position.y = 0.2;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.2, 6), std('#f4c542', { roughness: 0.55 })); body.rotation.z = Math.PI / 2; pencil.add(body);
  const wood = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.32, 6), std('#e7c49a')); wood.rotation.z = -Math.PI / 2; wood.position.x = 1.26; pencil.add(wood);
  const lead = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.11, 8), std('#3b3f45', { metalness: 0.4, roughness: 0.4 })); lead.rotation.z = -Math.PI / 2; lead.position.x = 1.44; pencil.add(lead);
  obj(pencil, 4.5, -1.1, 0.2);
  for (const dz of [-0.1, 0.1]) { const ch = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.055, 2.6, 10), std('#d8b67c', { roughness: 0.75 })); ch.rotation.z = Math.PI / 2; ch.position.y = 0.14; obj(ch, 3.6, -0.35 + dz, -0.08); }
  const ruler = new THREE.Mesh(new RoundedBoxGeometry(2.3, 0.05, 0.5, 2, 0.02), new THREE.MeshPhysicalMaterial({ color: '#7cc6c0', roughness: 0.2, transparent: true, opacity: 0.7 })); ruler.position.y = 0.12; obj(ruler, 4.8, -2.35, 0.9);
  // spoon = steel → nearly 0 Ω between the clips
  const clipW = wires.length; wires.push({ a: cA, b: cB, curve: null, len: 1, group: new THREE.Group(), waypoints: [], current: 0, dir: 1, fake: true });
  const sim = simulate([bat, L]); wires.splice(clipW, 1);
  window.__report = sim.report;
  cam(0.98, -0.12, 17.2, new V3(0.3, 0, 0.2));
  UI.innerHTML = `
    <div class="row" style="left:22px;top:18px"><div class="chip ok">🔍 Dẫn điện hay cách điện?</div><div class="chip amber">Thìa inox nằm giữa hai kẹp → đèn sáng!</div></div>
    <div class="card" style="right:22px;top:16px;width:250px"><b>Đặt đồ vật vào giữa hai kẹp</b><br>Đèn sáng → vật <b>dẫn điện</b><br>Đèn tắt → vật <b>cách điện</b></div>
    <div class="bar"><div class="btn on"><i>✅</i>Dẫn điện · 1</div><div class="btn"><i>⛔</i>Cách điện · 0</div><div class="btn"><i>🪙✏️🥢📏</i>Còn 5 đồ vật</div></div>`;
}

let diveUpdate = null;
if (SCENE === 'dive') {
  scene.background = new THREE.Color('#0d1822'); ground.visible = false; scene.environmentIntensity = 0.5; key.intensity = 1.1; key.castShadow = false;
  const rng = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  // copper: fcc lattice (a = 1.3 units ≈ 0.36 nm)
  const a = 1.3, basis = [[0, 0, 0], [0.5, 0.5, 0], [0.5, 0, 0.5], [0, 0.5, 0.5]], cu = [];
  for (let i = -6; i <= 1; i++) for (let j = -2; j <= 2; j++) for (let k = -1; k <= 1; k++) for (const b of basis) {
    const x = (i + b[0]) * a, y = (j + b[1]) * a, z = (k + b[2]) * a; if (x > 1.6) continue; cu.push([x, y, z]);
  }
  const cuMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.3, 24, 16), std('#e0925c', { metalness: 1, roughness: 0.28 }), cu.length);
  const m4 = new THREE.Matrix4(); cu.forEach((p, i) => { m4.makeTranslation(p[0], p[1], p[2]); cuMesh.setMatrixAt(i, m4); }); scene.add(cuMesh);
  // free electrons: random positions inside the copper block, jitter + slow drift (+x = toward +)
  const nE = 420, eBase = [];
  for (let i = 0; i < nE; i++) eBase.push([-7.6 + rng() * 9.0, -2.6 + rng() * 5.4, -1.3 + rng() * 3.3, rng() * 6.28, rng() * 6.28]);
  const eMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#8fe6ff').multiplyScalar(2.4) });
  const eMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.1, 10, 8), eMat, nE); scene.add(eMesh);
  // plastic: polyethylene-like zigzag chains (C dark, H white) with bound electrons hugging the atoms
  const cMat = std('#5b6470', { roughness: 0.5 }), hMat = std('#eef2f5', { roughness: 0.4 });
  const cPos = [];
  for (let c = 0; c < 5; c++) for (let d = 0; d < 2; d++) {
    const y0 = -2.4 + c * 1.2, z0 = -0.6 + d * 1.45;
    for (let s = 0; s < 9; s++) cPos.push([2.9 + s * 0.52, y0 + (s % 2 ? 0.3 : -0.3), z0]);
  }
  const cMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.26, 18, 12), cMat, cPos.length);
  const hPos = []; cPos.forEach((p, i) => { m4.makeTranslation(p[0], p[1], p[2]); cMesh.setMatrixAt(i, m4); hPos.push([p[0], p[1] + (i % 2 ? 0.42 : -0.42), p[2] + 0.28], [p[0], p[1] + (i % 2 ? 0.42 : -0.42), p[2] - 0.28]); });
  const hMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.12, 14, 10), hMat, hPos.length);
  hPos.forEach((p, i) => { m4.makeTranslation(p[0], p[1], p[2]); hMesh.setMatrixAt(i, m4); });
  scene.add(cMesh, hMesh);
  const bMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.075, 8, 6), eMat, cPos.length * 2); scene.add(bMesh);
  // interface plane between copper and plastic
  const face = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.05, depthWrite: false, side: THREE.DoubleSide }));
  face.rotation.y = Math.PI / 2; face.position.x = 2.25; scene.add(face);
  const drift = +(q.get('drift') ?? 1);
  diveUpdate = t => {
    eBase.forEach((e, i) => {
      let x = e[0] + drift * t * 0.25; x = -7.6 + (((x + 7.6) % 9.0) + 9.0) % 9.0;
      m4.makeTranslation(x + 0.18 * Math.sin(t * 7 + e[3]), e[1] + 0.18 * Math.sin(t * 6.3 + e[4]), e[2] + 0.18 * Math.cos(t * 5.1 + e[3])); eMesh.setMatrixAt(i, m4);
    });
    eMesh.instanceMatrix.needsUpdate = true;
    cPos.forEach((p, i) => for2(i, p, t));
    bMesh.instanceMatrix.needsUpdate = true;
  };
  const for2 = (i, p, t) => { for (let k = 0; k < 2; k++) { const ang = t * 3 + i * 1.7 + k * Math.PI; m4.makeTranslation(p[0] + 0.36 * Math.cos(ang), p[1] + 0.36 * Math.sin(ang) * 0.6, p[2] + 0.36 * Math.sin(ang)); bMesh.setMatrixAt(i * 2 + k, m4); } };
  cam(0.34, 0.5, 23, new V3(-0.3, -0.2, 0));
  UI.innerHTML = `
    <div class="title" style="left:33%;top:22px;color:#f4ead2"><b>ĐỒNG · lõi dây</b><span>electron tự do chạy lung tung, bật điện thì cả "biển" trôi chậm về cực (+)</span></div>
    <div class="title" style="left:79%;top:22px;color:#f4ead2"><b>NHỰA · vỏ dây</b><span>electron bị giữ chặt quanh nguyên tử</span></div>
    <div class="card" style="left:22px;bottom:18px;width:330px"><b>🔬 Soi dây — phóng to hàng chục triệu lần</b><br>Mỗi electron chỉ nhích vài phần trăm milimét mỗi giây, nhưng cả dây cùng chuyển động nên bật công tắc là đèn sáng ngay.</div>
    <div class="card" style="right:22px;bottom:18px"><div style="display:flex;align-items:center;gap:10px"><div style="width:${Math.round(0.5 / 0.28 * innerHeight / (2 * 23 * Math.tan(Math.PI / 12)))}px;height:6px;background:#1f2a37;border-radius:3px"></div><b>0,5 nm</b></div><span style="font-size:12px;opacity:.75">hình phóng to có chủ ý</span></div>`;
}

// ---------------------------------------------------------------- post-processing + loop
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
camera.position.copy(camPos); camera.lookAt(camTarget);
const viewCam = ortho ?? camera;
let composer = null;
if (FX) {
  composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType, multisampling: 4 });
  composer.addPass(new RenderPass(scene, viewCam));
  composer.addPass(new EffectPass(viewCam, new BloomEffect({ mipmapBlur: true, luminanceThreshold: +(q.get('bt') ?? 1.3), luminanceSmoothing: 0.35, intensity: +(q.get('bi') ?? 0.9), radius: 0.6 }), new ToneMappingEffect({ mode: ToneMappingMode.NEUTRAL })));
}
const electrons = VIEW === 'life' ? spawnElectrons() : null;
const clock = new THREE.Clock();
function frame() {
  const t = T_FIXED ?? clock.getElapsedTime();
  electrons?.update(t); diveUpdate?.(t);
  composer ? composer.render() : renderer.render(scene, viewCam);
  window.__frames = (window.__frames || 0) + 1;
  if (T_FIXED === null) requestAnimationFrame(frame);
}
if (T_FIXED !== null) { frame(); setTimeout(frame, 300); } else frame();
window.__ready = true;
window.__renderer = renderer;
</script>
