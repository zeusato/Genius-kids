<!doctype html><meta charset="utf-8"><title>Canvas bench</title>
<body style="background:#fff;font:14px monospace"><pre id="o">running…</pre>
<script>
const S = 2048, N = S * S, out = {};
const time = (k, f, n = 10) => { f(); const a = performance.now(); for (let i = 0; i < n; i++) f(); out[k] = +((performance.now() - a) / n).toFixed(2); };
const c = new OffscreenCanvas(S, S), g = c.getContext('2d', { willReadFrequently: false });
const img = new ImageData(S, S), u32 = new Uint32Array(img.data.buffer);
// vùng giả: hình tròn bán kính 600 (≈1.1M px) và vùng nhỏ 120×120
time('fill 1.1M px vào Uint32Array', () => { for (let y = 424; y < 1624; y++) { const h = Math.sqrt(600 * 600 - (y - 1024) ** 2) | 0; u32.fill(0xff3366ff, y * S + 1024 - h, y * S + 1024 + h); } });
time('putImageData toàn trang 2048²', () => g.putImageData(img, 0, 0));
time('putImageData khung 1200×1200', () => g.putImageData(img, 0, 0, 424, 424, 1200, 1200));
time('putImageData khung 120×120', () => g.putImageData(img, 0, 0, 900, 900, 120, 120));
// mặt nạ vùng cho bút: canvas cỡ khung bao, rồi destination-in
const m = new OffscreenCanvas(1200, 1200), mg = m.getContext('2d'); mg.beginPath(); mg.arc(600, 600, 600, 0, 7); mg.fill();
const s = new OffscreenCanvas(1200, 1200), sg = s.getContext('2d');
time('nét bút 40 đoạn + cắt theo vùng (destination-in) + ghép', () => {
  sg.globalCompositeOperation = 'source-over'; sg.clearRect(0, 0, 1200, 1200); sg.lineWidth = 36; sg.lineCap = 'round'; sg.strokeStyle = '#e84';
  sg.beginPath(); for (let i = 0; i < 40; i++) sg.lineTo(100 + i * 25, 600 + Math.sin(i) * 500); sg.stroke();
  sg.globalCompositeOperation = 'destination-in'; sg.drawImage(m, 0, 0); g.drawImage(s, 424, 424);
}, 30);
time('tạo mặt nạ vùng 1.1M px từ RLE (ImageData→canvas)', () => { const d = new ImageData(1200, 1200), v = new Uint32Array(d.data.buffer); for (let y = 0; y < 1200; y++) { const h = Math.sqrt(600 * 600 - (y - 600) ** 2) | 0; v.fill(0xff000000, y * 1200 + 600 - h, y * 1200 + 600 + h); } mg.putImageData(d, 0, 0); }, 5);
time('getImageData khung 1200² (đếm độ phủ)', () => { const d = g.getImageData(424, 424, 1200, 1200).data; let n = 0; for (let i = 3; i < d.length; i += 4) n += d[i] > 0; }, 5);
const vis = new OffscreenCanvas(1520, 1520), vg = vis.getContext('2d');
time('ghép 3 lớp ra màn 1520² (giấy+màu+nét)', () => { vg.fillStyle = '#fffaf0'; vg.fillRect(0, 0, 1520, 1520); vg.drawImage(c, 0, 0, 1520, 1520); vg.globalCompositeOperation = 'multiply'; vg.drawImage(c, 0, 0, 1520, 1520); vg.globalCompositeOperation = 'source-over'; }, 20);
out.ua = navigator.userAgent; out.cores = navigator.hardwareConcurrency;
document.getElementById('o').textContent = JSON.stringify(out, null, 1);
</script></body>
